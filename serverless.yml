service: ms-analitico

# Se usa la v3 a proposito: la v4 exige una cuenta de serverless.com y un
# SERVERLESS_ACCESS_KEY para cada deploy. La v3 solo necesita credenciales
# de AWS, que es lo unico que da el Learner Lab.
frameworkVersion: "3"

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  stage: ${opt:stage, "dev"}
  memorySize: 512
  timeout: 29
  architecture: x86_64
  environment:
    SERVICIO: ${self:service}
    SNS_TOPIC_ARN: ${cf:infra-compartida-${sls:stage}.SnsEventosArn}
    TABLA_EVENTOS_PROCESADOS: ${cf:infra-compartida-${sls:stage}.TablaEventosProcesados}
    BUCKET_DATALAKE: ${cf:infra-compartida-${sls:stage}.BucketDatalake}
    SNS_ALERTAS_ARN: ${cf:infra-compartida-${sls:stage}.SnsAlertasArn}
    TABLA_AGREGADOS: ${self:service}-agregados-${sls:stage}
  # AWS Academy no permite crear roles IAM: se reusa LabRole.
  # En una cuenta propia, borra la linea `role:` y descomenta los permisos,
  # que son los minimos que este microservicio necesita.
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
    # role:
    #   statements:
  #     - Effect: Allow
  #       Action:
  #         - sns:Publish
  #       Resource: ${cf:infra-compartida-${sls:stage}.SnsEventosArn}
  #     - Effect: Allow
  #       Action:
  #         - dynamodb:PutItem
  #       Resource: ${cf:infra-compartida-${sls:stage}.TablaEventosProcesadosArn}
  #     - Effect: Allow
  #       Action:
  #         - s3:PutObject
  #         - s3:GetObject
  #         - s3:ListBucket
  #       Resource:
  #         - ${cf:infra-compartida-${sls:stage}.BucketDatalakeArn}
  #         - ${cf:infra-compartida-${sls:stage}.BucketDatalakeArn}/*
  #
package:
  individually: false
  patterns:
    - "!**"
    - "src/**"

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    # true, no "non-linux": en Linux "non-linux" NO usa Docker y busca un
    # binario python3.12 local, que no existe (el sistema trae 3.14).
    # Forzar Docker ademas garantiza que psycopg se compile contra Amazon
    # Linux, que es donde corre la Lambda.
    dockerizePip: true
    slim: true
    # Cache propio por repo. El cache global de ~/.cache lo comparten todos
    # los servicios, y si dos despliegues corren a la vez un contenedor lo
    # deja en root:root mientras el otro lo lee -> EACCES.
    cacheLocation: ./.serverless-cache
  autorizador:
    # El authorizer vive en infra-compartida y lo comparten los 6 microservicios
    name: autorizadorCompartido
    type: request
    arn: ${cf:infra-compartida-${sls:stage}.AutorizadorArn}
    resultTtlInSeconds: 300
    identitySource: method.request.header.Authorization

functions:

  health:
    handler: src/handlers/health.manejar
    events:
      - http: { path: "/health", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  kpis:
    handler: src/handlers/kpis.resumen
    description: El dashboard ejecutivo, desde los agregados
    events:
      - http: { path: "/kpis", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  serie:
    handler: src/handlers/kpis.serie
    description: Evolucion mes a mes para los graficos
    events:
      - http: { path: "/kpis/serie", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  eventos:
    handler: src/handlers/kpis.eventos
    description: Asoma el data lake crudo en S3 - la prueba visible del EDA
    events:
      - http: { path: "/eventos", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  # ---------- Consumidores de eventos (EDA) ----------

  ingesta:
    handler: src/handlers/ingesta.manejar
    description: TODOS los eventos -> S3 + agregados
    timeout: 60
    events:
      - sqs:
          arn: !GetAtt ColaAnalitico.Arn
          batchSize: 10

  notificador:
    handler: src/handlers/notificador.manejar
    description: Eventos de riesgo -> topic ppm-alertas
    timeout: 30
    events:
      - sqs:
          arn: !GetAtt ColaAlertas.Arn
          batchSize: 10

resources:
  Resources:

    # Agregados del dashboard. S3 es la fuente de verdad; esto es la vista
    # rapida, porque Athena tarda segundos y se cobra por byte escaneado.
    TablaAgregados:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-agregados-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
        KeySchema:
          # pk = TENANT#<tid> · sk = PERIODO#2026-11 o PERIODO#TOTAL
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE

    # ---------- Cola de ingesta: SIN filtro, ve todo el trafico ----------
    ColaAnalitico:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ppm-cola-analitico-${sls:stage}
        VisibilityTimeout: 120
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt ColaAnaliticoDLQ.Arn
          maxReceiveCount: 3

    ColaAnaliticoDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ppm-cola-analitico-dlq-${sls:stage}
        MessageRetentionPeriod: 1209600

    SuscripcionAnalitico:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: ${cf:infra-compartida-${sls:stage}.SnsEventosArn}
        Protocol: sqs
        Endpoint: !GetAtt ColaAnalitico.Arn
        # Sin FilterPolicy a proposito: el data lake archiva TODO.

    # ---------- Cola de alertas: solo los eventos de riesgo ----------
    ColaAlertas:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ppm-cola-alertas-${sls:stage}
        VisibilityTimeout: 60
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt ColaAlertasDLQ.Arn
          maxReceiveCount: 3

    ColaAlertasDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ppm-cola-alertas-dlq-${sls:stage}
        MessageRetentionPeriod: 1209600

    SuscripcionAlertas:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: ${cf:infra-compartida-${sls:stage}.SnsEventosArn}
        Protocol: sqs
        Endpoint: !GetAtt ColaAlertas.Arn
        FilterPolicy:
          tipo:
            - presupuesto.excedido
            - recurso.sobreasignado

    PermisoSnsEnColas:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref ColaAnalitico
          - !Ref ColaAlertas
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal: { Service: sns.amazonaws.com }
              Action: sqs:SendMessage
              Resource: "*"
              Condition:
                ArnEquals:
                  aws:SourceArn: ${cf:infra-compartida-${sls:stage}.SnsEventosArn}
