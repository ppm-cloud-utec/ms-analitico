service: ms-analitico

frameworkVersion: "3"

provider:
  name: aws
  apiGateway:
    restApiId: ${cf:infra-compartida-${sls:stage}.ApiId}
    restApiRootResourceId: ${cf:infra-compartida-${sls:stage}.ApiRootResourceId}
  runtime: python3.12
  region: us-east-1
  stage: ${opt:stage, "dev"}
  memorySize: 512
  timeout: 29
  architecture: x86_64
  environment:
    SERVICIO: ${self:service}
    SNS_TOPIC_ARN: ${cf:infra-compartida-${sls:stage}.SnsEventosArn}
    TABLA_EVENTOS_PROCESADOS: ${cf:infra-compartida-${sls:stage}.TablaEventosProcesados}
    BUCKET_DATALAKE: ${cf:infra-compartida-${sls:stage}.BucketDatalake}
    SNS_ALERTAS_ARN: ${cf:infra-compartida-${sls:stage}.SnsAlertasArn}
    TABLA_AGREGADOS: ${self:service}-agregados-${sls:stage}
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
package:
  individually: false
  patterns:
    - "!**"
    - "src/**"

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: true
    slim: true
    cacheLocation: ./.serverless-cache
  autorizador:
    type: CUSTOM
    authorizerId: ${cf:infra-compartida-${sls:stage}.AutorizadorApiId}

functions:

  health:
    handler: src/handlers/health.manejar
    events:
      - http: { path: "/analitico/health", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  kpis:
    handler: src/handlers/kpis.resumen
    description: El dashboard ejecutivo, desde los agregados
    events:
      - http: { path: "/analitico/kpis", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  serie:
    handler: src/handlers/kpis.serie
    description: Evolucion mes a mes para los graficos
    events:
      - http: { path: "/analitico/kpis/serie", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  eventos:
    handler: src/handlers/kpis.eventos
    description: Asoma el data lake crudo en S3 - la prueba visible del EDA
    events:
      - http: { path: "/analitico/eventos", method: get, cors: true, authorizer: "${self:custom.autorizador}" }

  # ---------- Consumidores de eventos (EDA) ----------

  ingesta:
    handler: src/handlers/ingesta.manejar
    description: TODOS los eventos -> S3 + agregados
    timeout: 60
    events:
      - sqs:
          arn: !GetAtt ColaAnalitico.Arn
          batchSize: 10

  notificador:
    handler: src/handlers/notificador.manejar
    description: Eventos de riesgo -> topic ppm-alertas
    timeout: 30
    events:
      - sqs:
          arn: !GetAtt ColaAlertas.Arn
          batchSize: 10

resources:
  Resources:

    TablaAgregados:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-agregados-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
        KeySchema:
          # pk = TENANT#<tid> · sk = PERIODO#2026-11 o PERIODO#TOTAL
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE

    ColaAnalitico:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ppm-cola-analitico-${sls:stage}
        VisibilityTimeout: 120
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt ColaAnaliticoDLQ.Arn
          maxReceiveCount: 3

    ColaAnaliticoDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ppm-cola-analitico-dlq-${sls:stage}
        MessageRetentionPeriod: 1209600

    SuscripcionAnalitico:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: ${cf:infra-compartida-${sls:stage}.SnsEventosArn}
        Protocol: sqs
        Endpoint: !GetAtt ColaAnalitico.Arn
        # Sin FilterPolicy a proposito: el data lake archiva TODO.

    ColaAlertas:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ppm-cola-alertas-${sls:stage}
        VisibilityTimeout: 60
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt ColaAlertasDLQ.Arn
          maxReceiveCount: 3

    ColaAlertasDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ppm-cola-alertas-dlq-${sls:stage}
        MessageRetentionPeriod: 1209600

    SuscripcionAlertas:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: ${cf:infra-compartida-${sls:stage}.SnsEventosArn}
        Protocol: sqs
        Endpoint: !GetAtt ColaAlertas.Arn
        FilterPolicy:
          tipo:
            - presupuesto.excedido
            - recurso.sobreasignado

    PermisoSnsEnColas:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref ColaAnalitico
          - !Ref ColaAlertas
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal: { Service: sns.amazonaws.com }
              Action: sqs:SendMessage
              Resource: "*"
              Condition:
                ArnEquals:
                  aws:SourceArn: ${cf:infra-compartida-${sls:stage}.SnsEventosArn}

